<!DOCTYPE html>
<html lang="pt">
<>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>meu app</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f2f4f7;
  text-align: center;
}

.caixa {
  margin: 60px 20px;
  padding: 30px 20px;
  background: white;
  border-radius: 25px;
}

h1 {
  font-size: 38px;
}

button {
  padding: 15px 35px;
  border: none;
  border-radius: 30px;
  font-size: 18px;
  background: black;
  color: white;
}
</style>
</<link rel="manifest" href="manifest.json">
</head>>

<body>

<div class="caixa" id="inicio">
  <h1>meu app</h1>
  <p>Encontra Wi-Fi disponível e economiza os teus dados.</p>
  <button onclick="abrirApp()">COMEÇAR</button>
</div>

<div class="caixa" id="principal" style="display:none;">
<h1>wi-fi grátis</h1>
<p>Encontra redes wi-fi disponíveis perto de ti.</p>
<button onclick="procurarWifi()">procurar wi-fi</button>

<p id="resultado"></p>

<script>
function procurarWifi() {
  document.getElementById("resultado").innerText =
  "A procurar redes wi-fi disponíveis...";
}
</script>
</div>

<script>
function abrirApp() {
  document.getElementById("inicio").style.display = "none";
  document.getElementById("principal").style.display = "block";
}
</script>

</body>
</html>
